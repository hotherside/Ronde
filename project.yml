name: Ronde
options:
  bundleIdPrefix: com.ronde
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: WCJ787853P
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  # Universal iPhone/iPad Shot Reviewer companion required so Xcode accepts the
  # watch app bundle ID. The watch app remains independently usable.
  # Bundle ID prefix rule: watch (com.ronde.Ronde) must start with iOS (com.ronde) + "."
  # The watch app runs fully independently (WKRunsIndependentlyOfCompanionApp = YES).
  Ronde iOS:
    type: application
    platform: iOS
    productName: Ronde Shot Review
    sources:
      - path: Ronde iOS App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde
        PRODUCT_NAME: Ronde Shot Review
        PRODUCT_MODULE_NAME: Ronde
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: Ronde
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ronde uses your photo library so you can choose a range video to review."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Ronde saves confirmed shot clips to your photo library."
        INFOPLIST_KEY_NSCameraUsageDescription: "Ronde uses the camera to record range sessions and provide live shot review."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ronde uses the microphone to help detect impact timing during shot review."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Ronde Watch App

  Ronde iOS AppTests:
    type: bundle.unit-test
    platform: iOS
    productName: Ronde AppTests
    sources:
      - path: Ronde iOS AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.RondeAppTests
        PRODUCT_NAME: Ronde AppTests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Ronde iOS

  Ronde Watch App:
    type: application
    platform: watchOS
    productName: Ronde
    sources:
      - path: Ronde Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.Ronde
        PRODUCT_NAME: Ronde
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: "com.ronde"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ronde reads your workout data from the Health app."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Ronde saves your golf rounds as workouts in the Health app."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Ronde uses your location to find nearby golf courses."
        INFOPLIST_KEY_NSMotionUsageDescription: "Ronde uses motion sensors to track your steps and distance walked during a round."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Ronde Watch App/Ronde.entitlements
      properties:
        com.apple.developer.healthkit: true

schemes:
  Ronde Watch App:
    build:
      targets:
        Ronde Watch App: all
        Ronde iOS: all
    run:
      config: Debug
    archive:
      config: Release

  Ronde iOS:
    build:
      targets:
        Ronde iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Ronde iOS AppTests
    archive:
      config: Release
