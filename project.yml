name: Ronde
options:
  bundleIdPrefix: com.ronde
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: WCJ787853P
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.1

targets:
  # Universal iPhone/iPad shot media library and tracer.
  Ronde iOS:
    type: application
    platform: iOS
    productName: Ronde Shot Review
    attributes:
      SystemCapabilities:
        com.apple.SignInWithApple:
          enabled: 1
    sources:
      - path: Ronde iOS App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde
        PRODUCT_NAME: Ronde Shot Review
        PRODUCT_MODULE_NAME: Ronde
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: Ronde
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ronde uses your photo library so you can choose a range video to review."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Ronde saves confirmed shot clips to your photo library."
        INFOPLIST_KEY_NSCameraUsageDescription: "Ronde uses the camera to record range sessions and provide live shot review."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ronde uses the microphone to help detect impact timing during shot review."
        INFOPLIST_KEY_NSMotionUsageDescription: "Ronde checks whether the phone is steady before recording a shot review."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Ronde iOS App/Ronde.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Supabase

  Ronde iOS AppTests:
    type: bundle.unit-test
    platform: iOS
    productName: Ronde AppTests
    sources:
      - path: Ronde iOS AppTests
      - path: Ronde iOS AppUITests/Resources/studio-fixture.mp4
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.RondeAppTests
        PRODUCT_NAME: Ronde AppTests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Ronde iOS

  Ronde iOS AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Ronde iOS AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.RondeUITests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Ronde iOS

schemes:
  Ronde iOS:
    build:
      targets:
        Ronde iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Ronde iOS AppTests
        - Ronde iOS AppUITests
    archive:
      config: Release
