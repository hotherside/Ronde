name: HoleCount
options:
  bundleIdPrefix: com.ronde
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "16.0"

targets:
  HoleCount Watch App:
    type: application
    platform: watchOS
    sources:
      - path: HoleCount Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.HoleCount
        PRODUCT_NAME: HoleCount
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HoleCount Watch App/HoleCount.entitlements
      properties: {}
