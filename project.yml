name: Ronde
options:
  bundleIdPrefix: com.ronde
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: WCJ787853P
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  # Minimal iOS companion required so Xcode accepts the watch app bundle ID.
  # Bundle ID prefix rule: watch (com.ronde.Ronde) must start with iOS (com.ronde) + "."
  # The watch app runs fully independently (WKRunsIndependentlyOfCompanionApp = YES).
  Ronde iOS:
    type: application
    platform: iOS
    productName: Ronde
    sources:
      - path: Ronde iOS App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde
        PRODUCT_NAME: Ronde
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # Stub companion is iPhone-only; sidesteps the iPad multitasking
        # orientation warning. Watch app remains the real product.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: Ronde Watch App

  Ronde Watch App:
    type: application
    platform: watchOS
    productName: Ronde
    sources:
      - path: Ronde Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronde.Ronde
        PRODUCT_NAME: Ronde
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: "com.ronde"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ronde reads your workout data from the Health app."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Ronde saves your golf rounds as workouts in the Health app."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Ronde uses your location to find nearby golf courses."
        INFOPLIST_KEY_NSMotionUsageDescription: "Ronde uses motion sensors to track your steps and distance walked during a round."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Ronde Watch App/Ronde.entitlements
      properties:
        com.apple.developer.healthkit: true

schemes:
  Ronde Watch App:
    build:
      targets:
        Ronde Watch App: all
        Ronde iOS: all
    run:
      config: Debug
    archive:
      config: Release

  Ronde iOS:
    build:
      targets:
        Ronde iOS: all
    run:
      config: Debug
    archive:
      config: Release
