<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9df">
  <title>Ronde — Fieldwork</title>
  <link rel="stylesheet" href="fieldwork.css">
  <script defer src="fieldwork.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="app-header">
      <button class="wordmark" data-action="navigate" data-view="sessions" aria-label="Ronde sessions">ronde<span aria-hidden="true"></span></button>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button data-action="navigate" data-view="sessions">Sessions</button>
        <button data-action="navigate" data-view="shots">Shots <span class="saved-count">1</span></button>
      </nav>
      <button class="record-button" data-action="record"><span class="record-dot" aria-hidden="true"></span>Record</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="mobile-nav" aria-label="Main navigation">
      <button data-action="navigate" data-view="sessions"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M7 3h10M5 5h14M8 12h8"/></svg><span>Sessions</span></button>
      <button data-action="navigate" data-view="shots"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v16l-7-4-7 4V5a2 2 0 0 1 2-2Z"/></svg><span>Shots</span><span class="saved-count">1</span></button>
      <span class="nav-caption" aria-hidden="true">A GOOD DAY,<br>WELL KEPT.</span>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
